<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniHub - Apps, Games, Movies & Anime</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#07090d;
  --card:#11151d;
  --card2:#171c26;
  --text:#fff;
  --muted:#9ba3b4;
  --line:#252b38;
  --accent:#7c5cff;
  --green:#22c55e;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,input{font:inherit}
button{cursor:pointer}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(7,9,13,.95);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:25px;
  font-weight:900;
  white-space:nowrap;
}

.logo span{color:var(--accent)}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  padding:12px 15px 12px 40px;
  border-radius:13px;
  border:1px solid var(--line);
  outline:none;
  background:var(--card);
  color:white;
}

.search input:focus{
  border-color:var(--accent);
}

.search-icon{
  position:absolute;
  left:14px;
  top:11px;
  color:var(--muted);
}

/* HERO */
.hero{
  max-width:1200px;
  margin:25px auto 0;
  padding:0 18px;
}

.hero-box{
  border:1px solid var(--line);
  border-radius:24px;
  padding:35px;
  background:
  radial-gradient(circle at 85% 20%,rgba(124,92,255,.35),transparent 30%),
  radial-gradient(circle at 10% 90%,rgba(34,197,94,.10),transparent 25%),
  #0d1118;
}

.hero h1{
  font-size:clamp(34px,6vw,58px);
  line-height:1;
  max-width:700px;
}

.hero h1 span{color:#a18cff}

.hero p{
  color:var(--muted);
  max-width:650px;
  margin-top:15px;
  line-height:1.6;
}

.hero-buttons{
  display:flex;
  gap:10px;
  margin-top:22px;
  flex-wrap:wrap;
}

.primary,.secondary{
  border:0;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
}

.primary{
  background:var(--accent);
  color:white;
}

.secondary{
  background:#1a202b;
  color:white;
  border:1px solid var(--line);
}

/* CATEGORIES */
.categories{
  max-width:1200px;
  margin:25px auto 0;
  padding:0 18px;
  display:flex;
  gap:9px;
  overflow-x:auto;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{display:none}

.cat{
  border:1px solid var(--line);
  background:var(--card);
  color:#b7bfcd;
  padding:10px 16px;
  border-radius:999px;
  white-space:nowrap;
}

.cat.active,.cat:hover{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}

/* CONTENT */
.content{
  max-width:1200px;
  margin:28px auto;
  padding:0 18px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:15px;
}

.section-head h2{font-size:22px}

.section-head p{
  color:var(--muted);
  font-size:13px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  transition:.2s;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#454d5e;
}

.poster{
  height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:900;
  position:relative;
  overflow:hidden;
}

.poster:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,.1));
}

.poster span{
  position:relative;
  z-index:2;
  text-shadow:0 3px 12px rgba(0,0,0,.5);
}

.movie{
  background:linear-gradient(135deg,#57204f,#17152b);
}

.anime{
  background:linear-gradient(135deg,#164b75,#28153f);
}

.game{
  background:linear-gradient(135deg,#15533e,#15292e);
}

.app{
  background:linear-gradient(135deg,#604019,#291931);
}

.card-body{padding:14px}

.type{
  color:#a18cff;
  font-size:11px;
  text-transform:uppercase;
  font-weight:bold;
}

.title{
  margin-top:5px;
  font-weight:800;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
  display:flex;
  justify-content:space-between;
}

.rating{color:#ffd166}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{display:flex}

.modal-box{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:#10141c;
  border:1px solid var(--line);
  border-radius:22px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:15px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid var(--line);
  background:#11151d;
  color:white;
  font-size:22px;
  z-index:3;
}

.modal-poster{
  height:230px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  font-size:34px;
  font-weight:900;
}

.modal-content{padding:23px}

.modal-content h2{font-size:28px}

.description{
  color:var(--muted);
  line-height:1.6;
  margin-top:12px;
}

.modal-meta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

.badge{
  background:#1a202b;
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:9px;
  color:#cbd2df;
  font-size:12px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.action{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  font-weight:800;
}

.watch{
  background:var(--accent);
  color:white;
}

.download{
  background:var(--green);
  color:#06120a;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  display:none;
}

footer{
  border-top:1px solid var(--line);
  margin-top:45px;
  padding:28px 18px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:650px){
  .nav{flex-wrap:wrap}
  .logo{width:100%}
  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:11px;
  }
  .poster{height:145px}
  .hero-box{padding:25px}
}

@media(max-width:400px){
  .poster{
    height:135px;
    font-size:18px;
  }
}
</style>

</div>

let currentCategory="all";
let currentItem=null;

/* =========================
   ELEMENTS
========================= */

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const empty=document.getElementById("empty");
const count=document.getElementById("count");
const heading=document.getElementById("heading");

const modal=document.getElementById("modal");
const modalPoster=document.getElementById("modalPoster");
const modalTitle=document.getElementById("modalTitle");
const modalMeta=document.getElementById("modalMeta");
const modalDescription=document.getElementById("modalDescription");

const watchBtn=document.getElementById("watchBtn");
const downloadBtn=document.getElementById("downloadBtn");

/* =========================
   RENDER
========================= */

function render(){

  const query=search.value.toLowerCase().trim();

  const filtered=items.filter(item=>{

    const categoryMatch=
      currentCategory==="all" ||
      item.type===currentCategory;

    const searchMatch=
      item.title.toLowerCase().includes(query) ||
      item.type.toLowerCase().includes(query);

    return categoryMatch && searchMatch;

  });

  grid.innerHTML="";

  count.textContent=
    filtered.length+" item"+(filtered.length===1?"":"s");

  if(filtered.length===0){
    empty.style.display="block";
    return;
  }

  empty.style.display="none";

  filtered.forEach(item=>{

    const card=document.createElement("div");

    card.className="card";

    card.innerHTML=`

      <div class="poster ${posterClass(item.type)}">
        <span>${item.title}</span>
      </div>

      <div class="card-body">

        <div class="type">
          ${item.type}
        </div>

        <div class="title">
          ${item.title}
        </div>

        <div class="meta">

          <span>
            ${item.year}
          </span>

          <span class="rating">
            ⭐ ${item.rating}
          </span>

        </div>

      </div>
    `;

    card.onclick=()=>openModal(item);

    grid.appendChild(card);

  });

}

/* =========================
   POSTER CLASS
========================= */

function posterClass(type){

  if(type==="movies") return "movie";
  if(type==="anime") return "anime";
  if(type==="games") return "game";

  return "app";
}

/* =========================
   CATEGORY
========================= */

function setCategory(category){

  currentCategory=category;

  document.querySelectorAll(".cat").forEach(btn=>{

    btn.classList.toggle(
      "active",
      btn.dataset.category===category
    );

  });

  const names={
    all:"All Content",
    movies:"Movies",
    anime:"Anime",
    games:"Games",
    apps:"Apps"
  };

  heading.textContent=names[category];

  render();

  window.scrollTo({
    top:document.querySelector(".content").offsetTop-80,
    behavior:"smooth"
  });

}

document.querySelectorAll(".cat").forEach(btn=>{

  btn.addEventListener("click",()=>{

    setCategory(btn.dataset.category);

  });

});

/* =========================
   SEARCH
========================= */

search.addEventListener("input",render);

/* =========================
   MODAL
========================= */

function openModal(item){

  currentItem=item;

  modal.classList.add("show");

  modalTitle.textContent=item.title;

  modalPoster.textContent=item.title;

  modalPoster.className=
    "modal-poster "+posterClass(item.type);

  modalDescription.textContent=item.description;

  modalMeta.innerHTML=`

    <span class="badge">
      ${item.type.toUpperCase()}
    </span>

    <span class="badge">
      ⭐ ${item.rating}
    </span>

    <span class="badge">
      📅 ${item.year}
    </span>

    ${item.version ? `
      <span class="badge">
        Version ${item.ver
