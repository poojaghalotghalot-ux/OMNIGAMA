<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OmniHub | Apps, Games, Anime & Movies</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#08090d;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#0d0f15ee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid #242733;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:25px;
  font-weight:900;
  color:#8b5cf6;
  white-space:nowrap;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:12px 17px;
  border-radius:25px;
  border:1px solid #303442;
  outline:none;
  background:#151820;
  color:white;
  font-size:15px;
}

.hero{
  max-width:1200px;
  margin:25px auto;
  padding:35px 25px;
  border-radius:25px;
  background:linear-gradient(135deg,#171127,#101522);
  border:1px solid #292d3c;
}

.hero h1{
  font-size:42px;
  margin-bottom:10px;
}

.hero h1 span{
  color:#8b5cf6;
}

.hero p{
  color:#aeb2c0;
  max-width:650px;
  line-height:1.6;
}

.categories{
  max-width:1200px;
  margin:20px auto;
  padding:0 20px;
  display:flex;
  gap:10px;
  overflow:auto;
}

.categories button{
  background:#171a23;
  border:1px solid #303442;
  color:#ddd;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.categories button:hover,
.categories button.active{
  background:#8b5cf6;
  color:white;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:10px 20px 50px;
}

.section-title{
  font-size:24px;
  margin:25px 0 15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:#11141b;
  border:1px solid #252936;
  border-radius:18px;
  overflow:hidden;
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#8b5cf6;
}

.poster{
  height:145px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  background:linear-gradient(135deg,#24183c,#151a29);
}

.info{
  padding:15px;
}

.info h3{
  font-size:18px;
  margin-bottom:7px;
}

.meta{
  color:#9297a7;
  font-size:13px;
  margin-bottom:13px;
}

.tag{
  display:inline-block;
  background:#1e2230;
  color:#bca7ff;
  padding:4px 8px;
  border-radius:7px;
  font-size:11px;
  margin-bottom:10px;
}

.open{
  width:100%;
  padding:10px;
  border:0;
  border-radius:10px;
  background:#8b5cf6;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:50px;
  color:#8d92a2;
  display:none;
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
  border-top:1px solid #222631;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.modal-box{
  width:100%;
  max-width:600px;
  background:#11141b;
  border:1px solid #303442;
  border-radius:20px;
  padding:25px;
}

.close{
  float:right;
  background:#252936;
  border:0;
  color:white;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
}

.modal h2{
  margin:15px 0 10px;
}

.modal p{
  color:#aeb2c0;
  line-height:1.6;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modal-actions a{
  flex:1;
  text-align:center;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
  color:white;
  background:#8b5cf6;
}

.modal-actions a.secondary{
  background:#252936;
}

@media(max-width:600px){
  .nav{
    flex-wrap:wrap;
  }

  .logo{
    width:100%;
  }

  .hero h1{
    font-size:30px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .poster{
    height:115px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">OMNIHUB</div>

    <div class="search">
      <input id="search" type="search"
      placeholder="Search apps, games, anime, movies...">
    </div>
  </div>
</header>

<section class="hero">
  <h1>Welcome to <span>OmniHub</span></h1>
  <p>
    Discover apps, games, anime and movies in one clean place.
    Apps and games use legal/open-source sources.
  </p>
</section>

<div class="categories">
  <button class="active" onclick="filterItems('All',this)">All</button>
  <button onclick="filterItems('Apps',this)">Apps</button>
  <button onclick="filterItems('Games',this)">Games</button>
  <button onclick="filterItems('Anime',this)">Anime</button>
  <button onclick="filterItems('Movies',this)">Movies</button>
</div>

<main class="container">

  <div class="section-title">Explore</div>

  <div id="grid" class="grid"></div>

  <div id="empty" class="empty">
    No results found 😕
  </div>

</main>

<footer>
  © 2026 OmniHub • Legal & Open-Source Discovery Portal
</footer>

<div id="modal" class="modal">
  <div class="modal-box">

    <button class="close" onclick="closeModal()">×</button>

    <div id="modalIcon" style="font-size:60px"></div>

    <h2 id="modalTitle"></h2>

    <div id="modalMeta" class="meta"></div>

    <p id="modalDesc"></p>

    <div class="modal-actions">
      <a id="mainLink" href="#" target="_blank">Open</a>
      <a class="secondary" href="#" onclick="closeModal()">Close</a>
    </div>

  </div>
</div>

<script>

const items = [

/* ================= APPS ================= */

{
 name:"VLC for Android",
 type:"Apps",
 icon:"🎬",
 meta:"Media Player • Android",
 desc:"Powerful open-source video and audio player.",
 link:"https://f-droid.org/en/packages/org.videolan.vlc/"
},

{
 name:"NewPipe",
 type:"Apps",
 icon:"▶️",
 meta:"Video Player • Android",
 desc:"Lightweight open-source YouTube frontend.",
 link:"https://f-droid.org/en/packages/org.schabi.newpipe/"
},

{
 name:"Fossify Gallery",
 type:"Apps",
 icon:"🖼️",
 meta:"Gallery • Android",
 desc:"Private open-source photo and video gallery.",
 link:"https://f-droid.org/en/packages/org.fossify.gallery/"
},

{
 name:"Fossify File Manager",
 type:"Apps",
 icon:"📁",
 meta:"File Manager • Android",
 desc:"Simple open-source file manager.",
 link:"https://f-droid.org/en/packages/org.fossify.filemanager/"
},

{
 name:"Tasks.org",
 type:"Apps",
 icon:"✅",
 meta:"Productivity • Android",
 desc:"Open-source task and to-do manager.",
 link:"https://f-droid.org/en/packages/org.tasks/"
},

{
 name:"KDE Connect",
 type:"Apps",
 icon:"📱",
 meta:"Connectivity • Android",
 desc:"Connect and control devices across your network.",
 link:"https://f-droid.org/packages/org.kde.kdeconnect_tp/"
},

{
 name:"OsmAnd",
 type:"Apps",
 icon:"🗺️",
 meta:"Maps • Android",
 desc:"Open-source maps and navigation application.",
 link:"https://f-droid.org/en/packages/net.osmand.plus/"
},

/* ================= GAMES ================= */

{
 name:"Mindustry",
 type:"Games",
 icon:"⚙️",
 meta:"Strategy • Android",
 desc:"Factory building, tower defense and RTS game.",
 link:"https://f-droid.org/en/packages/io.anuke.mindustry/"
},

{
 name:"Unciv",
 type:"Games",
 icon:"🏛️",
 meta:"Strategy • Android",
 desc:"Open-source civilization-building strategy game.",
 link:"https://f-droid.org/en/packages/com.unciv.app/"
},

{
 name:"Shattered Pixel Dungeon",
 type:"Games",
 icon:"⚔️",
 meta:"RPG • Android",
 desc:"Open-source roguelike dungeon crawler.",
 link:"https://f-droid.org/en/packages/com.shatteredpixel.shatteredpixeldungeon/"
},

{
 name:"SuperTuxKart",
 type:"Games",
 icon:"🏎️",
 meta:"Racing • Android",
 desc:"Open-source 3D arcade racing game.",
 link:"https://f-droid.org/en/packages/org.supertuxkart.stk/"
},

/* ================= ANIME ================= */

{
 name:"Anime Discovery",
 type:"Anime",
 icon:"🌸",
 meta:"Legal Watch",
 desc:"Use official streaming services to watch anime legally.",
 link:"https://www.crunchyroll.com/"
},

{
 name:"Anime Hub",
 type:"Anime",
 icon:"🍥",
 meta:"Legal Watch",
 desc:"Find anime on official streaming platforms.",
 link:"https://www.crunchyroll.com/"
},

{
 name:"Anime Collection",
 type:"Anime",
 icon:"⭐",
 meta:"Legal Watch",
 desc:"Browse anime through official services.",
 link:"https://www.crunchyroll.com/"
},

/* ================= MOVIES ================= */

{
 name:"Movie Discovery",
 type:"Movies",
 icon:"🎥",
 meta:"Legal Watch",
 desc:"Find movies through legal streaming services.",
 link:"https://www.youtube.com/movies"
},

{
 name:"Free Movies",
 type:"Movies",
 icon:"🍿",
 meta:"Legal Watch",
 desc:"Browse legally available movies.",
 link:"https://www.youtube.com/movies"
},

{
 name:"Movie Collection",
 type:"Movies",
 icon:"🎞️",
 meta:"Legal Watch",
 desc:"Discover movies from official platforms.",
 link:"https://www.youtube.com/movies"
}

];

let currentCategory="All";
let currentSearch="";

function render(){

  const grid=document.getElementById("grid");
  const empty=document.getElementById("empty");

  grid.innerHTML="";

  const filtered=items.filter(item=>{

    const categoryMatch =
      currentCategory==="All" ||
      item.type===currentCategory;

    const searchMatch =
      item.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
      item.type.toLowerCase().includes(currentSearch.toLowerCase());

    return categoryMatch && searchMatch;
  });

  if(filtered.length===0){
    empty.style.display="block";
    return;
  }

  empty.style.display="none";

  filtered.forEach((item,index)=>{

    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`

      <div class="poster">
        ${item.icon}
      </div>

      <div class="info">

        <span class="tag">${item.type}</span>

        <h3>${item.name}</h3>

        <div class="meta">
          ${item.meta}
        </div>

        <button class="open"
          onclick="openModal(${items.indexOf(item)})">
          View Details
        </button>

      </div>
    `;

    grid.appendChild(card);
  });
}

function filterItems(category,button){

  currentCategory=category;

  document.querySelectorAll(".categories button")
  .forEach(btn=>btn.classList.remove("active"));

  button.classList.add("active");

  render();
}

document.getElementById("search")
.addEventListener("input",function(){

  currentSearch=this.value;

  render();
});

function openModal(index){

  const item=items[index];

  document.getElementById("modalIcon").textContent=item.icon;

  document.getElementById("modalTitle").textContent=item.name;

  document.getElementById("modalMeta").textContent=
    item.type+" • "+item.meta;

  document.getElementById("modalDesc").textContent=item.desc;

  const link=document.getElementById("mainLink");

  link.href=item.link;

  link.textContent=
    item.type==="Apps" || item.type==="Games"
    ? "Download / Open"
    : "Watch / Open";

  document.getElementById("modal").style.display="flex";
}

function closeModal(){

  document.getElementById("modal").style.display="none";
}

document.getElementById("modal")
.addEventListener("click",function(e){

  if(e.target===this){
    closeModal();
  }

});

render();

</script>

</body>
  </html>
