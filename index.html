<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stream Portal - 24H Lock System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e1e1e6;
            padding: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Top Header & Search Bar Area */
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
            gap: 15px;
        }

        header h1 {
            color: #00f2fe;
            font-size: 1.8rem;
            text-transform: uppercase;
        }

        /* Fast Search Bar */
        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            background: #1a1c23;
            border: 1px solid #333;
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .search-box input:focus {
            border-color: #00f2fe;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00f2fe;
        }

        /* Categories Section */
        .category-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.2rem;
            color: #00f2fe;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .cat-btn {
            background: #1a1c23;
            color: #aaa;
            border: 1px solid #333;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #00f2fe;
            color: #000;
            font-weight: bold;
            border-color: #00f2fe;
        }

        /* Video Stage View */
        .player-stage {
            display: none;
            background: #15171e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 30px;
            border: 1px solid #2a2d3d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .back-btn {
            background: #222531;
            color: #00f2fe;
            border: 1px solid #00f2fe;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* Top Web Servers Bar */
        .server-top-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 12px;
            border-bottom: 1px solid #262938;
        }

        .server-chip {
            background: #202330;
            color: #ccc;
            border: 1px solid #3a3f55;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .server-chip.active {
            background: #00f2fe;
            color: #000;
            font-weight: bold;
        }

        .video-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Featured Square Box Grid */
        .featured-square-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .square-card {
            aspect-ratio: 1 / 1;
            background: #1a1c23;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .square-card:hover {
            border-color: #00f2fe;
            transform: scale(1.03);
        }

        .square-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .square-card .overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
            color: #fff;
        }

        /* Main Anime Grid */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .anime-card {
            background: #15171e;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #222533;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            border-color: #00f2fe;
        }

        .anime-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .anime-card .card-info {
            padding: 10px;
            text-align: center;
        }

        .anime-card .card-info h4 {
            font-size: 0.95rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .anime-card .card-info span {
            font-size: 0.75rem;
            color: #00f2fe;
        }

        /* --- 24-HOUR 4-LINK UNLOCK MODAL POPUP --- */
        .unlock-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .unlock-modal {
            background: #1a1c24;
            border: 2px solid #00f2fe;
            border-radius: 15px;
            max-width: 450px;
            width: 100%;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.3);
        }

        .unlock-modal h3 {
            color: #00f2fe;
            margin-bottom: 10px;
            font-size: 1.4rem;
        }

        .unlock-modal p {
            color: #ccc;
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .link-counter-badge {
            background: #252836;
            color: #00f2fe;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid #3a3f58;
        }

        .action-link-btn {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .action-link-btn:hover {
            background: #4facfe;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER & FAST SEARCH BAR -->
    <header>
        <h1>Anime Stream Center</h1>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="searchAnime()" placeholder="Anime name search karein...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <!-- VIDEO STAGE VIEW -->
    <div class="player-stage" id="playerStage">
        <button class="back-btn" onclick="closePlayer()"><i class="fa-solid fa-arrow-left"></i> Home Par Wapas Jayein</button>
        <h2 id="videoTitle" style="margin-bottom: 10px;">Anime Title</h2>

        <!-- Top 6-7 Web Servers Links -->
        <div class="server-top-bar" id="serverBar">
            <!-- Dynamic Server Buttons -->
        </div>

        <!-- Video Player Frame -->
        <div class="video-box">
            <iframe id="embedPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <!-- CATEGORIES SECTION -->
    <div class="category-section">
        <div class="section-title"><i class="fa-solid fa-layer-group"></i> Category Choose Karein</div>
        <div class="category-bar">
            <button class="cat-btn active" onclick="filterCategory('All')">All</button>
            <button class="cat-btn" onclick="filterCategory('Action')">Action</button>
            <button class="cat-btn" onclick="filterCategory('Fantasy')">Fantasy</button>
            <button class="cat-btn" onclick="filterCategory('Adventure')">Adventure</button>
            <button class="cat-btn" onclick="filterCategory('Sci-Fi')">Sci-Fi</button>
        </div>
    </div>

    <!-- FEATURED PROFESSIONAL SQUARE ANIMES -->
    <div class="section-title"><i class="fa-solid fa-star"></i> Featured Professional Animes</div>
    <div class="featured-square-grid" id="featuredGrid">
        <!-- JS Square Cards -->
    </div>

    <!-- MAIN ANIME LIBRARY (9-10 Items) -->
    <div class="section-title"><i class="fa-solid fa-tv"></i> Full Anime Library</div>
    <div class="anime-grid" id="mainGrid">
        <!-- JS Grid Cards -->
    </div>
</div>

<!-- 24-HOUR 4-LINK UNLOCK POPUP MODAL -->
<div class="unlock-modal-overlay" id="unlockOverlay">
    <div class="unlock-modal">
        <i class="fa-solid fa-lock" style="font-size: 2.5rem; color: #00f2fe; margin-bottom: 15px;"></i>
        <h3>24 Hours Access Unlock</h3>
        <p>Video start karne ke liye niche button par tap karke link open karein aur back aayein (4 Steps Verification).</p>
        
        <div class="link-counter-badge" id="linkCounterText">Link 1 of 4</div>
        
        <button class="action-link-btn" id="openLinkBtn" onclick="processUnlockStep()">
            <i class="fa-solid fa-external-link-alt"></i> Open Link 1
        </button>
    </div>
</div>

            ]
        }
    ];

    // Check if 24 Hours Unlocked
    function is24HoursUnlocked() {
        const unlockTimestamp = localStorage.getItem('anime_unlock_time');
        if (!unlockTimestamp) return false;

        const currentTime = new Date().getTime();
        const hoursPassed = (currentTime - unlockTimestamp) / (1000 * 60 * 60);

        return hoursPassed < 24; // 24 Ghante tak unlocked rahega
    }

    // Tap on Anime Thumbnail
    function handleAnimeClick(id) {
        if (is24HoursUnlocked()) {
            playAnimeDirectly(id);
        } else {
            pendingAnimeId = id;
            currentLinkIndex = 0;
            updateModalUI();
            document.getElementById('unlockOverlay').style.display = 'flex';
        }
    }

    // Process Unlock Links Step-by-Step
    function processUnlockStep() {
        if (currentLinkIndex < verificationLinks.length) {
            // Open Link in New Tab
            window.open(verificationLinks[currentLinkIndex], '_blank');

            currentLinkIndex++;

            if (currentLinkIndex < verificationLinks.length) {
                updateModalUI();
            } else {
                // Save 24h Unlock timestamp
                localStorage.setItem('anime_unlock_time', new Date().getTime());
                document.getElementById('unlockOverlay').style.display = 'none';
                
                // Play Video
                if (pendingAnimeId) {
                    playAnimeDirectly(pendingAnimeId);
                }
            }
        }
    }

    function updateModalUI() {
        document.getElementById('linkCounterText').innerText = `Link ${currentLinkIndex + 1} of 4`;
        document.getElementById('openLinkBtn').innerHTML = `<i class="fa-solid fa-external-link-alt"></i> Open Link ${currentLinkIndex + 1}`;
    }

    // Play Video Function
    function playAnimeDirectly(id) {
        const anime = animeDatabase.find(item => item.id === id);
        if (!anime) return;

        const stage = document.getElementById('playerStage');
        stage.style.display = 'block';

        document.getElementById('videoTitle').innerText = anime.title;

        // Render 6-7 Web Servers
        const serverBar = document.getElementById('serverBar');
        serverBar.innerHTML = '';

        anime.webServers.forEach((srv, index) => {
            const chip = document.createElement('button');
            chip.className = 'server-chip' + (index === 0 ? ' active' : '');
            chip.innerText = srv.name;
            chip.onclick = () => switchServer(srv.url, chip);
            serverBar.appendChild(chip);
        });

        switchServer(anime.webServers[0].url, serverBar.children[0]);
        stage.scrollIntoView({ behavior: 'smooth' });
    }

    function switchServer(url, element) {
        document.getElementById('embedPlayer').src = url;
        if (element) {
            document.querySelectorAll('.server-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
        }
    }

    // Fast Search Functionality
    function searchAnime() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        
        const filtered = animeDatabase.filter(a => a.title.toLowerCase().includes(query));
        renderLibraryData(filtered);
    }

    function renderFeatured() {
        const featContainer = document.getElementById('featuredGrid');
        featContainer.innerHTML = '';

        const featuredAnimes = animeDatabase.filter(a => a.featured);
        featuredAnimes.forEach(anime => {
            const card = document.createElement('div');
            card.className = 'square-card';
            card.onclick = () => handleAnimeClick(anime.id);

            card.innerHTML = `
                <img src="${anime.thumbnail}" alt="${anime.title}">
                <div class="overlay">${anime.title}</div>
            `;
            featContainer.appendChild(card);
        });
    }

    function renderLibraryData(list) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';

        list.forEach(anime => {
            const card = document.createElement('div');
            card.className = 'anime-card';
            card.onclick = () => handleAnimeClick(anime.id);

            card.innerHTML = `
                <img src="${anime.thumbnail}" alt="${anime.title}">
                <div class="card-info">
                    <h4>${anime.title}</h4>
                    <span>${anime.category}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterCategory(cat) {
        document.querySelectorAll('.cat-btn').forEach(btn => {
            if (btn.innerText === cat) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        if (cat === 'All') {
            renderLibraryData(animeDatabase);
        } else {
            const filtered = animeDatabase.filter(a => a.category === cat);
            renderLibraryData(filtered);
        }
    }

    function closePlayer() {
        document.getElementById('embedPlayer').src = '';
        document.getElementById('playerStage').style.display = 'none';
    }

    window.onload = () => {
        renderFeatured();
        renderLibraryData(animeDatabase);
    };
</script>

</body>
</html>
