<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Featured Offers</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#07111f;
  color:#fff;
}

.box{
  width:100%;
  max-width:560px;
  background:#101d2d;
  border:1px solid #26384d;
  border-radius:24px;
  padding:28px;
  text-align:center;
  box-shadow:0 20px 60px #0008;
}

.badge{
  display:inline-block;
  padding:7px 14px;
  border-radius:30px;
  background:#19334d;
  color:#8fd3ff;
  font-size:13px;
  margin-bottom:18px;
}

.logo{
  width:80px;
  height:80px;
  border-radius:20px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  background:#182b40;
}

h1{font-size:30px;margin-bottom:10px}

.desc{
  color:#aebdcb;
  line-height:1.6;
  margin-bottom:22px;
}

.progress{
  height:7px;
  background:#253548;
  border-radius:20px;
  overflow:hidden;
  margin:18px 0;
}

.progress-bar{
  height:100%;
  width:25%;
  background:#36d399;
  transition:.3s;
}

.timer{
  color:#8fd3ff;
  font-size:14px;
  margin-bottom:18px;
}

.actions{
  display:flex;
  gap:12px;
}

button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.open{
  background:#36d399;
  color:#06140e;
}

.skip{
  background:#263548;
  color:#fff;
}

button:hover{
  transform:translateY(-2px);
}

.note{
  margin-top:20px;
  color:#718396;
  font-size:11px;
  line-height:1.5;
}

.done{
  display:none;
}

.done h2{
  margin-bottom:12px;
}

.restart{
  margin-top:20px;
  width:100%;
  background:#36d399;
  color:#06140e;
}

@media(max-width:500px){
  .box{padding:22px}
  h1{font-size:25px}
}
</style>
</head>

<body>

<div class="box" id="offerBox">

  <div class="badge">✨ Featured Offer</div>

  <div class="logo" id="logo">🛒</div>

  <h1 id="title">JioMart</h1>

  <p class="desc" id="description">
    Explore groceries, daily essentials and more.
  </p>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="timer">
    Offer <span id="number">1</span> of 4
  </div>

  <div class="actions">
    <button class="open" id="openBtn">Open Offer</button>
    <button class="skip" id="skipBtn">Skip</button>
  </div>

  <p class="note">
    You choose whether to open an offer. External websites open only after
    your action.
  </p>

</div>


<div class="box done" id="doneBox">

  <div class="logo">✓</div>

  <h2>All offers completed</h2>

  <p class="desc">
    You have reached the end of today's promotion list.
  </p>

  <button class="restart" id="restartBtn">
    View Offers Again
  </button>

</div>


<script>

/*
  =====================================================
  EDIT LINKS HERE
  Replace these with your approved affiliate links
  if you have affiliate accounts.
  =====================================================
*/

const offers = [

  {
    name:"JioMart",
    icon:"🛒",
    description:"Explore groceries, daily essentials and more.",
    url:"https://www.jiomart.com/"
  },

  {
    name:"Amazon",
    icon:"📦",
    description:"Discover products, deals and everyday essentials.",
    url:"https://www.amazon.in/"
  },

  {
    name:"Flipkart",
    icon:"🛍️",
    description:"Browse electronics, fashion, groceries and more.",
    url:"https://www.flipkart.com/"
  },

  {
    name:"Meesho",
    icon:"🛒",
    description:"Discover fashion, home products and more.",
    url:"https://www.meesho.com/"
  }

];


/* Current offer */
let current = 0;


/* Elements */
const title = document.getElementById("title");
const logo = document.getElementById("logo");
const description = document.getElementById("description");
const number = document.getElementById("number");
const progressBar = document.getElementById("progressBar");

const offerBox = document.getElementById("offerBox");
const doneBox = document.getElementById("doneBox");

const openBtn = document.getElementById("openBtn");
const skipBtn = document.getElementById("skipBtn");
const restartBtn = document.getElementById("restartBtn");


/* Show current offer */
function showOffer(){

  if(current >= offers.length){
    offerBox.style.display="none";
    doneBox.style.display="block";
    return;
  }

  const offer = offers[current];

  title.textContent = offer.name;
  logo.textContent = offer.icon;
  description.textContent = offer.description;

  number.textContent = current + 1;

  progressBar.style.width =
    ((current + 1) / offers.length * 100) + "%";
}


/* Open offer */
openBtn.addEventListener("click",()=>{

  const offer = offers[current];

  /*
    Opens only after the user clicks.
  */
  window.open(
    offer.url,
    "_blank",
    "noopener,noreferrer"
  );

  nextOffer();
});


/* Skip */
skipBtn.addEventListener("click",()=>{
  nextOffer();
});


/* Next */
function nextOffer(){

  current++;

  if(current >= offers.length){

    /*
      Save completion time.
      24-hour cycle.
    */
    localStorage.setItem(
      "offersCompletedAt",
      Date.now().toString()
    );

  }

  showOffer();
}


/* Restart manually */
restartBtn.addEventListener("click",()=>{

  current=0;

  localStorage.removeItem("offersCompletedAt");

  doneBox.style.display="none";
  offerBox.style.display="block";

  showOffer();

});


/*
  24-HOUR CHECK

  After completing all 4 offers, the normal
  promotion cycle stays completed for 24 hours.

  After 24 hours, it becomes available again.
*/

const completedAt =
  Number(localStorage.getItem("offersCompletedAt") || 0);

const twentyFourHours = 24 * 60 * 60 * 1000;

if(
  completedAt &&
  Date.now() - completedAt < twentyFourHours
){

  offerBox.style.display="none";
  doneBox.style.display="block";

}else{

  showOffer();

}

</script>

</body>
</html>
