<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OmniHub | Movies, Anime, Games & Apps</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--bg:#080c14;
--card:#121826;
--purple:#8b5cf6;
--cyan:#06b6d4;
--text:#f3f4f6;
--muted:#9ca3af;
}

body{
background:var(--bg);
color:var(--text);
font-family:Arial,sans-serif;
min-height:100vh;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:10;
background:rgba(8,12,20,.96);
backdrop-filter:blur(15px);
border-bottom:1px solid #252b38;
padding:15px;
}

.header{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
gap:15px;
flex-wrap:wrap;
}

.logo{
font-size:24px;
font-weight:900;
color:white;
text-decoration:none;
}

.logo span{
color:var(--cyan);
}

nav{
display:flex;
gap:5px;
overflow-x:auto;
}

nav button{
background:#151c2b;
border:1px solid #293244;
color:var(--muted);
padding:9px 14px;
border-radius:8px;
cursor:pointer;
white-space:nowrap;
}

nav button.active,
nav button:hover{
background:var(--purple);
color:white;
}

.search{
margin-left:auto;
min-width:220px;
}

.search input{
width:100%;
padding:10px 14px;
border-radius:9px;
border:1px solid #293244;
background:#111827;
color:white;
outline:none;
}

/* MAIN */

main{
max-width:1200px;
margin:auto;
padding:25px 15px;
}

.title{
margin-bottom:20px;
}

.title h1{
font-size:25px;
}

.title p{
color:var(--muted);
font-size:13px;
margin-top:5px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:18px;
}

/* CARD */

.card{
background:var(--card);
border:1px solid #252d3c;
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:.25s;
}

.card:hover{
transform:translateY(-5px);
border-color:var(--purple);
box-shadow:0 10px 30px #0008;
}

.poster{
height:240px;
width:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:15px;
font-size:21px;
font-weight:900;
background-size:cover;
background-position:center;
}

.info{
padding:13px;
}

.info h3{
font-size:15px;
margin-bottom:6px;
}

.info p{
font-size:12px;
color:var(--muted);
margin-bottom:4px;
}

.rating{
color:#fbbf24 !important;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:#000d;
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:100;
}

.modal.show{
display:flex;
}

.box{
background:#0d1322;
border:1px solid #30394b;
border-radius:18px;
width:100%;
max-width:750px;
max-height:90vh;
overflow:auto;
padding:20px;
position:relative;
}

.close{
position:absolute;
right:15px;
top:12px;
border:0;
background:#ffffff18;
color:white;
width:35px;
height:35px;
border-radius:50%;
font-size:22px;
cursor:pointer;
}

.modal h2{
margin:10px 40px 12px 0;
}

.modal p{
color:#c5cad3;
font-size:14px;
line-height:1.5;
margin-bottom:10px;
}

.modalPoster{
width:140px;
height:190px;
object-fit:cover;
border-radius:12px;
margin-bottom:15px;
display:none;
}

video{
width:100%;
border-radius:12px;
background:#000;
margin:10px 0 15px;
display:none;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
}

.btn{
display:inline-block;
padding:11px 16px;
border-radius:9px;
border:0;
text-decoration:none;
color:white;
font-weight:bold;
cursor:pointer;
background:linear-gradient(135deg,var(--purple),var(--cyan));
}

.btn.secondary{
background:#202938;
}

/* EMPTY */

.empty{
grid-column:1/-1;
text-align:center;
padding:50px 10px;
color:var(--muted);
}

/* FOOTER */

footer{
text-align:center;
padding:35px 15px;
margin-top:40px;
border-top:1px solid #252b38;
color:var(--muted);
font-size:13px;
}

/* MOBILE */

@media(max-width:600px){

.header{
flex-direction:column;
align-items:stretch;
}

.search{
margin-left:0;
}

.grid{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.poster{
height:210px;
font-size:17px;
}

}
</style>

</head>

<body>

<header>

<div class="header">

<a class="logo"
href="#"
onclick="showCategory('all');return false;">
OMNI<span>HUB</span>
</a>

<nav>

<button id="all"
class="active"
onclick="showCategory('all')">
All
</button>

<button id="anime"
onclick="showCategory('anime')">
Anime
</button>

<button id="movies"
onclick="showCategory('movies')">
Movies
</button>

<button id="games"
onclick="showCategory('games')">
Games
</button>

<button id="apps"
onclick="showCategory('apps')">
Apps
</button>

</nav>

<div class="search">

<input
id="search"
placeholder="Search movies, anime, games & apps..."
oninput="render()">

</div>

</div>

</header>


<main>

<div class="title">

<h1 id="pageTitle">
All Content
</h1>

<p>
Movies & Anime to watch. Games & Apps to download.
</p>

</div>

<div
class="grid"
id="grid">
</div>

</main>


<!-- MODAL -->

<div
class="modal"
id="modal"
onclick="closeOutside(event)">

<div class="box">

<button
class="close"
onclick="closeModal()">
×
</button>

<img
id="modalPoster"
class="modalPoster"
src=""
alt="Poster">

<h2 id="modalTitle"></h2>

<p id="modalDescription"></p>

<p id="modalMeta"></p>

<video
id="player"
controls
playsinline>

<source
id="videoSource"
src=""
type="video/mp4">

Your browser does not support video.

</video>

<div class="actions">

<a
id="watchBtn"
class="btn"
href="#"
target="_blank"
style="display:none">
▶ Watch
</a>

<a
id="downloadBtn"
class="btn"
href="#"
download
style="display:none">
📥 Download
</a>

<button
id="playBtn"
class="btn secondary"
onclick="playVideo()"
style="display:none">
▶ Play Video
</button>

</div>

</div>

</div>


<footer>

© 2026 OmniHub • Movies • Anime • Games • Apps

</footer>


<script>

/* =========================================
   OMNIHUB DATA
   ========================================= */

const items = [

/* ================= MOVIES ================= */

{
id:"movie1",
type:"movies",
title:"My Movie",
poster:"",
rating:"4.5",
year:"2026",
description:
"Add your legally licensed movie information here.",
watch:"https://example.com"
},

/* ================= ANIME ================= */

{
id:"anime1",
type:"anime",
title:"My Anime",
poster:"",
rating:"4.7",
episodes:"12 Episodes",
description:
"Add your legally licensed anime information here.",
watch:"https://example.com"
},

/* ================= GAMES ================= */

{
id:"game1",
type:"games",
title:"My Game",
poster:"",
rating:"4.8",
version:"1.0",
size:"100 MB",
description:
"Add your own or authorized game here.",
download:"YOUR-AUTHORIZED-GAME-LINK"
},

/* ================= APPS ================= */

{
id:"app1",
type:"apps",
title:"My App",
poster:"",
rating:"4.6",
version:"1.0",
size:"25 MB",
description:
"Add your own or authorized application here.",
download:"YOUR-AUTHORIZED-APP-LINK"
}

];


/* =========================================
   CATEGORY
   ========================================= */

let category="all";


function showCategory(type){

category=type;

document
.querySelectorAll("nav button")
.forEach(button=>{
button.classList.remove("active");
});

document
.getElementById(type)
.classList.add("active");


const titles={

all:"All Content",

anime:"Anime",

movies:"Movies",

games:"Games",

apps:"Apps"

};


document
.getElementById("pageTitle")
.innerText=titles[type];

render();

}


/* =========================================
   RENDER
   ========================================= */

function render(){

const grid=
document.getElementById("grid");

const search=
document
.getElementById("search")
.value
.toLowerCase()
.trim();


const data=items.filter(item=>{

const correctCategory=
category==="all" ||
item.type===category;

const correctSearch=
item.title
.toLowerCase()
.includes(search);

return correctCategory &&
correctSearch;

});


if(data.length===0){

grid.innerHTML=`

<div class="empty">

<h2>No content found</h2>

<p>
Try another search or category.
</p>

</div>

`;

return;

}


grid.innerHTML=data.map(item=>{

let posterHTML="";


if(item.poster){

posterHTML=`

<div
class="poster"
style="
background-image:
url('${item.poster}');
">
</div>

`;

}else{

posterHTML=`

<div
class="poster"
style="
background:
linear-gradient(
135deg,
${getColor(item.type,0)},
${getColor(item.type,1)}
);
">

${item.title}

</div>

`;

}


return `

<div
class="card"
onclick="openItem('${item.id}')">

${posterHTML}

<div class="info">

<h3>
${item.title}
</h3>

<p>
${item.type.toUpperCase()}
</p>

${item.rating ?
`<p class="rating">
★ ${item.rating}
</p>`
:""}

${item.year ?
`<p>
📅 ${item.year}
</p>`
:""}

${item.version ?
`<p>
Version ${item.version}
</p>`
:""}

${item.size ?
`<p>
💾 ${item.size}
</p>`
:""}

</div>

</div>

`;

}).join("");

}


/* =========================================
   COLORS
   ========================================= */

function getColor(type,n){

const colors={

anime:[
"#7c3aed",
"#ec4899"
],

movies:[
"#0f172a",
"#2563eb"
],

games:[
"#ca8a04",
"#f59e0b"
],

apps:[
"#0369a1",
"#06b6d4"
]

};

return colors[type][n];

}


/* =========================================
   OPEN ITEM
   ========================================= */

function openItem(id){

const item=
items.find(x=>x.id===id);

if(!item)return;


document
.getElementById("modalTitle")
.innerText=item.title;


document
.getElementById("modalDescription")
.innerText=item.description;


const poster=
document.getElementById("modalPoster");


if(item.poster){

poster.src=item.poster;
poster.style.display="block";

}else{

poster.style.display="none";

}


/* META */

let meta="";

if(item.rating)
meta+="⭐ "+item.rating+"   ";

if(item.year)
meta+="📅 "+item.year+"   ";

if(item.episodes)
meta+="🎞️ "+item.episodes+"   ";

if(item.version)
meta+="📦 Version "+item.version+"   ";

if(item.size)
meta+="💾 "+item.size;


document
.getElementById("modalMeta")
.innerText=meta;


/* BUTTONS */

const watch=
document.getElementById("watchBtn");

const download=
document.getElementById("downloadBtn");

const player=
document.getElementById("player");

const playBtn=
document.getElementById("playBtn");

const source=
document.getElementById("videoSource");


watch.style.display="none";
download.style.display="none";
playBtn.style.display="none";
player.style.display="none";


/* MOVIE / ANIME */

if(
item.type==="movies" ||
item.type==="anime"
){

if(item.watch){

watch.href=item.watch;
watch.style.display="inline-block";

}


/* Own legal video */

if(item.video){

source.src=item.video;

player.load();

player.style.display="block";

playBtn.style.display="inline-block";

}

}


/* GAME / APP */

if(
item.type==="games" ||
item.type==="apps"
){

if(item.download){

download.href=item.download;

download.download="";

download.style.display="inline-block";

}


/* Optional trailer */

if(item.video){

source.src=item.video;

player.load();

player.style.display="block";

playBtn.style.display="inline-block";

}

}


document
.getElementById("modal")
.classList.add("show");

}


/* =========================================
   PLAY
   ========================================= */

function playVideo(){

const player=
document.getElementById("player");

player.play();

}


/* =========================================
   CLOSE
   ========================================= */

function closeModal(){

const player=
document.getElementById("player");

player.pause();

player.currentTime=0;

document
.getElementById("modal")
.classList.remove("show");

}


function closeOutside(event){

if(event.target.id==="modal"){

closeModal();

}

}


/* =========================================
   START
   ========================================= */

render();

</script>

</body>
</html>
