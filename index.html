<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stream Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #66fcf1;
            --text-color: #c5c6c7;
            --highlight-color: #45a29e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Player Container */
        .player-section {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #333;
            margin-bottom: 30px;
        }

        /* Server Bar Header */
        .server-control-bar {
            background: var(--card-bg);
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid #333;
        }

        .anime-title-display {
            font-weight: bold;
            color: #fff;
            font-size: 1.1rem;
        }

        .server-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .server-selector-wrapper label {
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        select.server-dropdown {
            background-color: var(--bg-color);
            color: #fff;
            border: 1px solid var(--highlight-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        /* Server Tabs */
        .server-buttons-bar {
            background: #151922;
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid #222;
        }

        .server-btn {
            background: #252c3b;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .server-btn:hover, .server-btn.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        /* Video Iframe Frame */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Anime Catalog Section */
        .catalog-title {
            margin-bottom: 15px;
            color: var(--accent-color);
            font-size: 1.4rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .anime-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            border-color: var(--highlight-color);
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.2);
        }

        .anime-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .anime-info {
            padding: 12px;
        }

        .anime-info h3 {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .anime-info p {
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid =>-play"></i> AnimeVerse Portal</h1>
        <p>Multiple Servers me Anime Stream Karein</p>
    </header>

    <!-- Main Player Section -->
    <div class="player-section">
        <div class="server-control-bar">
            <div class="anime-title-display" id="currentAnimeTitle">Anime Select Karein</div>
            
            <div class="server-selector-wrapper">
                <label for="serverSelect"><i class="fa-solid fa-server"></i> Server Choose Karein:</label>
                <select id="serverSelect" class="server-dropdown" onchange="changeServer(this.value)">
                    <!-- Options JavaScript se render honge -->
                </select>
            </div>
        </div>

        <!-- Server Quick Access Buttons -->
        <div class="server-buttons-bar" id="serverButtons">
            <!-- Buttons dynamically load honge -->
        </div>

        <!-- Video Player Display -->
        <div class="video-wrapper">
            <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <!-- Anime Selection Grid -->
    <h2 class="catalog-title">Available Anime Series</h2>
    <div class="anime-grid" id="animeGrid">
        <!-- Anime List dynamically load hogi -->
    </div>
</div>

<script>
    // Database Structure: Every Anime has 6-7 Provider Embed Links
    const animeData = [
        {
            id: "1",
            title: "Naruto Shippuden",
            poster: "https://via.placeholder.com/200x260/1f2833/66fcf1?text=Naruto",
            servers: [
                { name: "Server 1 (Vidstreaming)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 2 (Gogoanime)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 3 (Streamtape)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 4 (Doodstream)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 5 (Filemoon)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 6 (Mixdrop)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 7 (StreamWish)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" }
            ]
        },
        {
            id: "2",
            title: "Attack On Titan",
            poster: "https://via.placeholder.com/200x260/1f2833/66fcf1?text=AOT",
            servers: [
                { name: "Server 1 (Vidcloud)", url: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                { name: "Server 2 (Vidstreaming)", url: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                { name: "Server 3 (Mp4upload)", url: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                { name: "Server 4 (Streamtape)", url: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                { name: "Server 5 (Doodstream)", url: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                { name: "Server 6 (Filemoon)", url: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                { name: "Server 7 (Upstream)", url: "https://www.youtube.com/embed/dQw4w9WgXcQ" }
            ]
        },
        {
            id: "3",
            title: "Demon Slayer",
            poster: "https://via.placeholder.com/200x260/1f2833/66fcf1?text=Demon+Slayer",
            servers: [
                { name: "Server 1 (FastServer)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 2 (Gogoanime)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 3 (Vidstreaming)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 4 (Streamtape)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 5 (Doodstream)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 6 (Mixdrop)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" },
                { name: "Server 7 (Filemoon)", url: "https://www.youtube.com/embed/tgbNymZ7vqY" }
            ]
        }
    ];

    let currentSelectedAnime = null;

    // Load Anime Cards
    function renderCatalog() {
        const grid = document.getElementById('animeGrid');
        grid.innerHTML = '';

        animeData.forEach(anime => {
            const card = document.createElement('div');
            card.className = 'anime-card';
            card.onclick = () => loadAnime(anime.id);

            card.innerHTML = `
                <img src="${anime.poster}" alt="${anime.title}">
                <div class="anime-info">
                    <h3>${anime.title}</h3>
                    <p>${anime.servers.length} Servers Available</p>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Load selected anime into player
    function loadAnime(animeId) {
        currentSelectedAnime = animeData.find(a => a.id === animeId);
        
        if (!currentSelectedAnime) return;

        document.getElementById('currentAnimeTitle').innerText = currentSelectedAnime.title;

        // Build server dropdown & buttons
        const select = document.getElementById('serverSelect');
        const buttonsContainer = document.getElementById('serverButtons');
        
        select.innerHTML = '';
        buttonsContainer.innerHTML = '';

        currentSelectedAnime.servers.forEach((server, index) => {
            // Populate Dropdown
            const option = document.createElement('option');
            option.value = server.url;
            option.innerText = server.name;
            select.appendChild(option);

            // Populate Button bar
            const btn = document.createElement('button');
            btn.className = 'server-btn' + (index === 0 ? ' active' : '');
            btn.innerText = server.name;
            btn.onclick = () => {
                select.value = server.url;
                changeServer(server.url);
            };
            buttonsContainer.appendChild(btn);
        });

        // Set default server link (First link)
        changeServer(currentSelectedAnime.servers[0].url);
        
        // Scroll player into view
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Direct change video player URL without confirmation popup
    function changeServer(url) {
        const iframe = document.getElementById('videoPlayer');
        iframe.src = url;

        // Update button active UI
        const buttons = document.querySelectorAll('.server-btn');
        buttons.forEach(btn => {
            if (currentSelectedAnime) {
                const match = currentSelectedAnime.servers.find(s => s.url === url);
                if (match && btn.innerText === match.name) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            }
        });
    }

    // Initialize Page
    window.onload = () => {
        renderCatalog();
        loadAnime("1"); // Auto load first anime
    };
</script>

</body>
</html>
