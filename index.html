<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#090b12">

<title>OmniHub</title>

<style>
:root{
  --bg:#080a10;
  --panel:#11141d;
  --panel2:#171b26;
  --line:#252b39;
  --text:#fff;
  --muted:#9299aa;
  --accent:#805cff;
  --accent2:#a98fff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 0%,#21144a 0,transparent 32%),
    radial-gradient(circle at 90% 20%,#172451 0,transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(18px);
  background:rgba(8,10,16,.82);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:var(--accent2);
}

.live{
  display:flex;
  align-items:center;
  gap:6px;
  color:#b9bfd0;
  font-size:11px;
  background:#151923;
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:30px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#42e68a;
  box-shadow:0 0 10px #42e68a;
}

.search{
  width:100%;
  margin-top:14px;
  padding:13px 16px;
  border:1px solid var(--line);
  outline:none;
  border-radius:13px;
  background:#11141d;
  color:#fff;
}

.search:focus{
  border-color:var(--accent);
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:12px;
  padding-bottom:2px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#151923;
  color:#bfc4d1;
  padding:9px 15px;
  border-radius:30px;
}

.cat.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.main{
  max-width:1200px;
  margin:auto;
  padding:20px 18px 60px;
}

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:24px;
  padding:30px 22px;
  background:
    linear-gradient(135deg,rgba(128,92,255,.22),rgba(20,24,37,.7));
}

.hero h1{
  position:relative;
  z-index:1;
  font-size:clamp(28px,6vw,50px);
  letter-spacing:-2px;
}

.hero p{
  position:relative;
  z-index:1;
  max-width:650px;
  color:#b4bac8;
  margin-top:10px;
  line-height:1.55;
}

.hero-actions{
  position:relative;
  z-index:2;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.primary,
.secondary{
  border:0;
  padding:12px 17px;
  border
