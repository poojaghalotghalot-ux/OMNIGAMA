<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Hub - Merged Web Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e1e1e6;
            padding: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
            border-bottom: 1px solid #1f2833;
            margin-bottom: 20px;
        }

        .logo {
            color: #66fcf1;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .search-box {
            position: relative;
            width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 35px 8px 12px;
            background: #1f2833;
            border: 1px solid #45a29e;
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #66fcf1;
        }

        /* Compact Square Grid Interface */
        .square-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
        }

        .square-card {
            aspect-ratio: 1 / 1;
            background: #1f2833;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .square-card:hover {
            border-color: #66fcf1;
            transform: scale(1.05);
        }

        .square-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .square-card .card-title {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            padding: 4px;
            text-align: center;
            font-size: 0.75rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Video Stage View */
        .player-stage {
            display: none;
            background: #1f2833;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #45a29e;
        }

        .back-btn {
            background: #0b0c10;
            color: #66fcf1;
            border: 1px solid #66fcf1;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        .anime-detail-header {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            background: #0b0c10;
            padding: 12px;
            border-radius: 8px;
        }

        .anime-detail-header img {
            width: 70px;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #66fcf1;
        }

        .detail-info h2 {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .meta-tags {
            display: flex;
            gap: 10px;
            font-size: 0.8rem;
            margin-bottom: 6px;
        }

        .tag-cat {
            background: #45a29e;
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .servers-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .server-btn {
            background: #0b0c10;
            color: #fff;
            border: 1px solid #45a29e;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .server-btn.active {
            background: #66fcf1;
            color: #000;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- ADVANCED 4-AD TIMER MODAL WITH MISCLICK TRIGGER --- */
        .ad-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .ad-modal-box {
            background: #1f2833;
            border: 2px solid #66fcf1;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.3);
        }

        .ad-counter-badge {
            background: #0b0c10;
            color: #66fcf1;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            border: 1px solid #45a29e;
        }

        .timer-circle {
            font-size: 1.8rem;
            color: #ff0055;
            font-weight: bold;
            margin: 10px 0;
        }

        .auto-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .auto-form input {
            padding: 10px;
            background: #0b0c10;
            border: 1px solid #45a29e;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }

        .ad-confirm-btn {
            background: #66fcf1;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: opacity 0.3s;
        }

        .ad-confirm-btn:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo"><i class="fa-solid fa-play"></i> Anime Hub Merged</div>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="searchAnime()" placeholder="Search Anime or Merged Web...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <!-- VIDEO STAGE VIEW -->
    <div class="player-stage" id="playerStage">
        <button class="back-btn" onclick="closePlayer()"><i class="fa-solid fa-arrow-left"></i> Home</button>

        <div class="anime-detail-header">
            <img id="detailPoster" src="" alt="Anime Poster">
            <div class="detail-info">
                <h2 id="detailTitle">Anime Name</h2>
                <div class="meta-tags">
                    <span class="tag-cat" id="detailCategory">Action</span>
                </div>
            </div>
        </div>

        <div class="servers-bar" id="serversBar"></div>

        <div class="video-container" id="videoContainer">
            <iframe id="mainIframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <!-- MAIN COMPACT SQUARE GRID -->
    <div class="square-grid" id="animeGrid"></div>
</div>

<!-- 4-ADS MODAL OVERLAY WITH TIMER & MISCLICK POP-UNDER TRIGGER -->
<div class="ad-modal-overlay" id="adModalOverlay" onclick="handleMisclick(event)">
    <div class="ad-modal-box" onclick="event.stopPropagation();">
        <div class="ad-counter-badge" id="adCounterText">Ad 1 of 4</div>
        <h3 style="color: #66fcf1;">Sponsored Access Verification</h3>
        <p style="font-size: 0.85rem; color: #c5c6c7; margin-top: 5px;">Timer khatam hone par auto-verification complete hoga.</p>

        <!-- Countdown Timer Display -->
        <div class="timer-circle" id="timerDisplay">10s</div>

        <!-- Auto-Fill Form Fields -->
        <div class="auto-form">
            <input type="text" id="verifyTokenInput" value="Generating Token..." readonly>
            <input type="text" id="verifyStatusInput" value="Status: Waiting Timer..." readonly>
        </div>

        <button class="ad-confirm-btn" id="adConfirmBtn" onclick="nextAdStep()" disabled>
            Wait 10 Seconds...
        </button>
    </div>
</div>

<script>
    // Aapka Custom Ad Link yahan daalein
    const MY_AD_LINK = "https://www.google.com";

    // Merged External Web Streaming Databases
    const animeDatabase = [
        {
            id: 1,
            title: "Naruto",
            category: "Action",
            poster: "https://images.justwatch.com/poster/240015525/s332/season-1.webp",
            webServers: [
                { name: "Crunchyroll Web", url: "https://www.crunchyroll.com/search?q=Naruto" },
                { name: "AniWatch Web", url: "https://aniwatchtv.to/search?keyword=Naruto" },
                { name: "Gogoanime Web", url: "https://anitaku.to/search.html?keyword=Naruto" },
                { name: "HiAnime Web", url: "https://hianime.to/search?keyword=Naruto" },
                { name: "Embed Stream 1", url: "https://www.youtube-nocookie.com/embed/2uP_W_R_R38?autoplay=1" },
                { name: "Embed Stream 2", url: "https://www.youtube-nocookie.com/embed/-G9BqkgZXRA?autoplay=1" }
            ]
        },
        {
            id: 2,
            title: "Attack On Titan",
            category: "Fantasy",
            poster: "https://images.justwatch.com/poster/305282585/s332/season-1.webp",
            webServers: [
                { name: "Crunchyroll Web", url: "https://www.crunchyroll.com/search?q=Attack+On+Titan" },
                { name: "AniWatch Web", url: "https://aniwatchtv.to/search?keyword=Attack+On+Titan" },
                { name: "Gogoanime Web", url: "https://anitaku.to/search.html?keyword=Attack+On+Titan" },
                { name: "HiAnime Web", url: "https://hianime.to/search?keyword=Attack+On+Titan" },
                { name: "Embed Stream 1", url: "https://www.youtube-nocookie.com/embed/MGRm4IzK1SQ?autoplay=1" },
                { name: "Embed Stream 2", url: "https://www.youtube-nocookie.com/embed/Lu41L3G2-C8?autoplay=1" }
            ]
        },
        {
            id: 3,
            title: "Demon Slayer",
            category: "Action",
            poster: "https://images.justwatch.com/poster/243886737/s332/season-1.webp",
            webServers: [
                { name: "Crunchyroll Web", url: "https://www.crunchyroll.com/search?q=Demon+Slayer" },
                { name: "AniWatch Web", url: "https://aniwatchtv.to/search?keyword=Demon+Slayer" },
                { name: "Gogoanime Web", url: "https://anitaku.to/search.html?keyword=Demon+Slayer" },
                { name: "HiAnime Web", url: "https://hianime.to/search?keyword=Demon+Slayer" },
                { name: "Embed Stream 1", url: "https://www.youtube-nocookie.com/embed/VQGCKyvzIM4?autoplay=1" },
                { name: "Embed Stream 2", url: "https://www.youtube-nocookie.com/embed/WYUYP3M_W-M?autoplay=1" }
            ]
        }
    ];

    let currentAdIndex = 1;
    let timerInterval = null;
    let timeLeft = 10;
    let pendingAnimeId = null;

    // Check if 24 Hours Unlocked
    function is24HoursUnlocked() {
        const unlockTimestamp = localStorage.getItem('anime_ad_unlock_time');
        if (!unlockTimestamp) return false;
        const currentTime = new Date().getTime();
        return ((currentTime - unlockTimestamp) / (1000 * 60 * 60)) < 24;
    }

    // Tap Anime -> Start 4-Ad Verification with Timer
    function handleAnimeClick(id) {
        if (is24HoursUnlocked()) {
            playAnime(id);
        } else {
            pendingAnimeId = id;
            currentAdIndex = 1;
            document.getElementById('adModalOverlay').style.display = 'flex';
            startAdTimer();
        }
    }

    // 10-Seconds Countdown Timer + Auto Fill Inputs
    function startAdTimer() {
        timeLeft = 10;
        const confirmBtn = document.getElementById('adConfirmBtn');
        confirmBtn.disabled = true;
        
        document.getElementById('adCounterText').innerText = `Ad ${currentAdIndex} of 4`;
        document.getElementById('verifyTokenInput').value = "Generating Token...";
        document.getElementById('verifyStatusInput').value = "Status: Waiting Timer...";

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timerDisplay').innerText = `${timeLeft}s`;
            confirmBtn.innerText = `Wait ${timeLeft} Seconds...`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timerDisplay').innerText = "DONE!";
                
                // Auto Fill Inputs
                document.getElementById('verifyTokenInput').value = "TOKEN: " + Math.random().toString(36).substring(2, 10).toUpperCase();
                document.getElementById('verifyStatusInput').value = "Status: VERIFIED ✓";

                confirmBtn.disabled = false;
                confirmBtn.innerText = currentAdIndex < 4 ? `Confirm & Go to Ad ${currentAdIndex + 1}` : "Start Watching Anime Now";
            }
        }, 1000);
    }

    // Next Ad Step or Unlock Stream
    function nextAdStep() {
        // Open Ad Link
        window.open(MY_AD_LINK, '_blank');

        if (currentAdIndex < 4) {
            currentAdIndex++;
            startAdTimer();
        } else {
            // Save 24h Unlock timestamp
            localStorage.setItem('anime_ad_unlock_time', new Date().getTime());
            document.getElementById('adModalOverlay').style.display = 'none';
            if (pendingAnimeId) playAnime(pendingAnimeId);
        }
    }

    // Misclick Event (Confirm ke alawa aas paas click karne par link khulega)
    function handleMisclick(e) {
        window.open(MY_AD_LINK, '_blank');
    }

    // Play Selected Anime
    function playAnime(id) {
        const anime = animeDatabase.find(a => a.id === id);
        if (!anime) return;

        const stage = document.getElementById('playerStage');
        stage.style.display = 'block';

        document.getElementById('detailPoster').src = anime.poster;
        document.getElementById('detailTitle').innerText = anime.title;
        document.getElementById('detailCategory').innerText = anime.category;

        const serversBar = document.getElementById('serversBar');
        serversBar.innerHTML = '';

        anime.webServers.forEach((srv, idx) => {
            const btn = document.createElement('button');
            btn.className = 'server-btn' + (idx === 0 ? ' active' : '');
            btn.innerText = srv.name;
            btn.onclick = () => loadVideoSource(srv.url, btn);
            serversBar.appendChild(btn);
        });

        loadVideoSource(anime.webServers[0].url, serversBar.children[0]);
        stage.scrollIntoView({ behavior: 'smooth' });
    }

    function loadVideoSource(url, element) {
        const iframe = document.getElementById('mainIframe');
        iframe.src = url;

        if (element) {
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }
    }

    // Render Compact Square Grid Interface
    function renderSquareGrid(list) {
        const grid = document.getElementById('animeGrid');
        grid.innerHTML = '';

        list.forEach(anime => {
            const card = document.createElement('div');
            card.className = 'square-card';
            card.onclick = () => handleAnimeClick(anime.id);

            card.innerHTML = `
                <img src="${anime.poster}" alt="${anime.title}">
                <div class="card-title">${anime.title}</div>
            `;
            grid.appendChild(card);
        });
    }

    // Search Feature
    function searchAnime() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = animeDatabase.filter(a => a.title.toLowerCase().includes(query));
        renderSquareGrid(filtered);
    }

    function closePlayer() {
        document.getElementById('mainIframe').src = '';
        document.getElementById('playerStage').style.display = 'none';
    }

    window.onload = () => {
        renderSquareGrid(animeDatabase);
    };
</script>

</body>
</html>
