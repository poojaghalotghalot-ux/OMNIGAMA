<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OmniHub | Movies, Anime, Games & Apps</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--bg:#070b13;
--card:#111827;
--card2:#172033;
--purple:#8b5cf6;
--cyan:#06b6d4;
--text:#f8fafc;
--muted:#94a3b8;
--border:#273449;
}

body{
background:var(--bg);
color:var(--text);
font-family:Arial,sans-serif;
min-height:100vh;
}

header{
position:sticky;
top:0;
z-index:20;
background:rgba(7,11,19,.96);
backdrop-filter:blur(15px);
border-bottom:1px solid var(--border);
padding:15px;
}

.header{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
gap:15px;
flex-wrap:wrap;
}

.logo{
font-size:25px;
font-weight:900;
color:white;
text-decoration:none;
}

.logo span{
color:var(--cyan);
}

nav{
display:flex;
gap:6px;
overflow-x:auto;
}

nav button{
background:#151d2c;
border:1px solid var(--border);
color:var(--muted);
padding:9px 14px;
border-radius:9px;
cursor:pointer;
white-space:nowrap;
}

nav button.active{
background:linear-gradient(135deg,var(--purple),var(--cyan));
color:white;
border-color:transparent;
}

.search{
margin-left:auto;
min-width:230px;
}

.search input{
width:100%;
padding:11px 14px;
border-radius:10px;
border:1px solid var(--border);
background:#101827;
color:white;
outline:none;
}

main{
max-width:1200px;
margin:auto;
padding:25px 15px;
}

.title{
margin-bottom:22px;
}

.title h1{
font-size:27px;
}

.title p{
color:var(--muted);
font-size:13px;
margin-top:6px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
gap:18px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:.25s;
}

.card:hover{
transform:translateY(-5px);
border-color:var(--purple);
box-shadow:0 10px 30px #0008;
}

.poster{
height:245px;
width:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:15px;
font-size:20px;
font-weight:900;
background-size:cover;
background-position:center;
}

.info{
padding:13px;
}

.info h3{
font-size:15px;
margin-bottom:7px;
}

.info p{
font-size:12px;
color:var(--muted);
margin-bottom:5px;
}

.rating{
color:#fbbf24 !important;
}

.modal{
position:fixed;
inset:0;
background:#000d;
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:100;
}

.modal.show{
display:flex;
}

.box{
background:#0d1322;
border:1px solid #30394b;
border-radius:18px;
width:100%;
max-width:750px;
max-height:90vh;
overflow:auto;
padding:20px;
position:relative;
}

.close{
position:absolute;
right:15px;
top:12px;
border:0;
background:#ffffff18;
color:white;
width:35px;
height:35px;
border-radius:50%;
font-size:22px;
cursor:pointer;
}

.modal h2{
margin:10px 40px 12px 0;
}

.modal p{
color:#c5cad3;
font-size:14px;
line-height:1.5;
margin-bottom:10px;
}

.modalPoster{
width:150px;
height:200px;
object-fit:cover;
border-radius:12px;
margin-bottom:15px;
display:none;
}

video{
width:100%;
border-radius:12px;
background:#000;
margin:10px 0 15px;
display:none;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
}

.btn{
display:inline-block;
padding:11px 16px;
border-radius:9px;
border:0;
text-decoration:none;
color:white;
font-weight:bold;
cursor:pointer;
background:linear-gradient(135deg,var(--purple),var(--cyan));
}

.btn.secondary{
background:#202938;
}

.empty{
grid-column:1/-1;
text-align:center;
padding:60px 10px;
color:var(--muted);
}

footer{
text-align:center;
padding:35px 15px;
margin-top:40px;
border-top:1px solid var(--border);
color:var(--muted);
font-size:13px;
}

@media(max-width:600px){

.header{
flex-direction:column;
align-items:stretch;
}

.search{
margin-left:0;
}

.grid{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.poster{
height:210px;
font-size:17px;
}

}
</style>
</head>

</div>

/* =====================================================
   CATEGORY
   ===================================================== */

let category="all";

function showCategory(type){

category=type;

document.querySelectorAll("nav button")
.forEach(button=>{
button.classList.remove("active");
});

document.getElementById(type)
.classList.add("active");

const titles={
all:"All Content",
anime:"Anime",
movies:"Movies",
games:"Games",
apps:"Apps"
};

document.getElementById("pageTitle")
.innerText=titles[type];

render();
}


/* =====================================================
   RENDER
   ===================================================== */

function render(){

const grid=document.getElementById("grid");

const search=document
.getElementById("search")
.value
.toLowerCase()
.trim();

const data=items.filter(item=>{

const correctCategory=
category==="all" ||
item.type===category;

const correctSearch=
item.title
.toLowerCase()
.includes(search);

return correctCategory && correctSearch;

});

if(data.length===0){

grid.innerHTML=`
<div class="empty">
<h2>No content found</h2>
<p>Try another search or category.</p>
</div>
`;

return;
}

grid.innerHTML=data.map(item=>{

let posterHTML="";

if(item.poster){

posterHTML=`
<div
class="poster"
style="background-image:url('${item.poster}');">
</div>
`;

}else{

posterHTML=`
<div
class="poster"
style="
background:linear-gradient(
135deg,
${getColor(item.type,0)},
${getColor(item.type,1)}
);">
${item.title}
</div>
`;

}

return `
<div
class="card"
onclick="openItem('${item.id}')">

${posterHTML}

<div class="info">

<h3>${item.title}</h3>

<p>${item.type.toUpperCase()}</p>

${item.rating ?
`<p class="rating">★ ${item.rating}</p>`
:""}

${item.year ?
`<p>📅 ${item.year}</p>`
:""}

${item.episodes ?
`<p>🎞️ ${item.episodes}</p>`
:""}

${item.version ?
`<p>Version ${item.version}</p>`
:""}

${item.size ?
`<p>💾 ${item.size}</p>`
:""}

</div>
</div>
`;

}).join("");

}


/* =====================================================
   COLORS
   ===================================================== */

function getColor(type,n){

const colors={

anime:[
"#7c3aed",
"#ec4899"
],

movies:[
"#0f172a",
"#2563eb"
],

games:[
"#ca8a04",
"#f59e0b"
],

apps:[
"#0369a1",
"#06b6d4"
]

};

return colors[type][n];

}


/* =====================================================
   OPEN ITEM
   ===================================================== */

function openItem(id){

const item=items.find(x=>x.id===id);

if(!item)return;

document.getElementById("modalTitle")
.innerText=item.title;

document.getElementById("modalDescription")
.innerText=item.description;

const poster=
document.getElementById("modalPoster");

if(item.poster){

poster.src=item.poster;
poster.style.display="block";

}else{

poster.style.display="none";

}

let meta="";

if(item.rating)
meta+="⭐ "+item.rating+"   ";

if(item.year)
meta+="📅 "+item.year+"   ";

if(item.episodes)
meta+="🎞️ "+item.episodes+"   ";

if(item.version)
meta+="📦 Version "+item.version+"   ";

if(item.size)
meta+="💾 "+item.size;

document.getElementById("modalMeta")
.innerText=meta;

const watch=
document.getElementById("watchBtn");

const download=
document.getElementById("downloadBtn");

const player=
document.getElementById("player");

const playBtn=
document.getElementById("playBtn");

const source=
document.getElementById("videoSource");

watch.style.display="none";
download.style.display="none";
playBtn.style.display="none";
player.style.display="none";

source.src="";


/* MOVIES + ANIME */

if(
item.type==="movies" ||
item.type==="anime"
){

if(item.watch){

watch.href=item.watch;
watch.style.display="inline-block";

}

if(item.video){

source.src=item.video;

player.load();

player.style.display="block";

playBtn.style.display="inline-block";

}

}


/* GAMES + APPS */

if(
item.type==="games" ||
item.type==="apps"
){

if(item.download){

download.href=item.download;

download.style.display="inline-block";

}

if(item.video){

source.src=item.video;

player.load();

player.style.display="block";

playBtn.style.display="inline-block";

}

}

document.getElementById("modal")
.classList.add("show");

}


/* =====================================================
   PLAY VIDEO
   ===================================================== */

function playVideo(){

const player=
document.getElementById("player");

player.play();

}


/* =====================================================
   CLOSE
   ===================================================== */

function closeModal(){

const player=
document.getElementById("player");

player.pause();

player.currentTime=0;

document.getElementById("modal")
.classList.remove("show");

}

function closeOutside(event){

if(event.target.id==="modal"){

closeModal();

}

}


/* =====================================================
   START
   ===================================================== */

render();

</script>
