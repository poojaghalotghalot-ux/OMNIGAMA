<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OmniHub | Movies, Anime, Games & Apps</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--bg:#070b13;
--card:#111827;
--card2:#172033;
--purple:#8b5cf6;
--cyan:#06b6d4;
--text:#f8fafc;
--muted:#94a3b8;
--border:#273449;
}

body{
background:var(--bg);
color:var(--text);
font-family:Arial,sans-serif;
min-height:100vh;
}

header{
position:sticky;
top:0;
z-index:20;
background:rgba(7,11,19,.96);
backdrop-filter:blur(15px);
border-bottom:1px solid var(--border);
padding:15px;
}

.header{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
gap:15px;
flex-wrap:wrap;
}

.logo{
font-size:25px;
font-weight:900;
color:white;
text-decoration:none;
}

.logo span{
color:var(--cyan);
}

nav{
display:flex;
gap:6px;
overflow-x:auto;
}

nav button{
background:#151d2c;
border:1px solid var(--border);
color:var(--muted);
padding:9px 14px;
border-radius:9px;
cursor:pointer;
white-space:nowrap;
}

nav button.active{
background:linear-gradient(135deg,var(--purple),var(--cyan));
color:white;
border-color:transparent;
}

.search{
margin-left:auto;
min-width:230px;
}

.search input{
width:100%;
padding:11px 14px;
border-radius:10px;
border:1px solid var(--border);
background:#101827;
color:white;
outline:none;
}

main{
max-width:1200px;
margin:auto;
padding:25px 15px;
}

.title{
margin-bottom:22px;
}

.title h1{
font-size:27px;
}

.title p{
color:var(--muted);
font-size:13px;
margin-top:6px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
gap:18px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:.25s;
}

.card:hover{
transform:translateY(-5px);
border-color:var(--purple);
box-shadow:0 10px 30px #0008;
}

.poster{
height:245px;
width:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:15px;
font-size:20px;
font-weight:900;
background-size:cover;
background-position:center;
}

.info{
padding:13px;
}

.info h3{
font-size:15px;
margin-bottom:7px;
}

.info p{
font-size:12px;
color:var(--muted);
margin-bottom:5px;
}

.rating{
color:#fbbf24 !important;
}

.modal{
position:fixed;
inset:0;
background:#000d;
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:100;
}

.modal.show{
display:flex;
}

.box{
background:#0d1322;
border:1px solid #30394b;
border-radius:18px;
width:100%;
max-width:750px;
max-height:90vh;
overflow:auto;
padding:20px;
position:relative;
}

.close{
position:absolute;
right:15px;
top:12px;
border:0;
background:#ffffff18;
color:white;
width:35px;
height:35px;
border-radius:50%;
font-size:22px;
cursor:pointer;
}

.modal h2{
margin:10px 40px 12px 0;
}

.modal p{
color:#c5cad3;
font-size:14px;
line-height:1.5;
margin-bottom:10px;
}

.modalPoster{
width:150px;
height:200px;
object-fit:cover;
border-radius:12px;
margin-bottom:15px;
display:none;
}

video{
width:100%;
border-radius:12px;
background:#000;
margin:10px 0 15px;
display:none;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
}

.btn{
display:inline-block;
padding:11px 16px;
border-radius:9px;
border:0;
text-decoration:none;
color:white;
font-weight:bold;
cursor:pointer;
background:linear-gradient(135deg,var(--purple),var(--cyan));
}

.btn.secondary{
background:#202938;
}

.empty{
grid-column:1/-1;
text-align:center;
padding:60px 10px;
color:var(--muted);
}

footer{
text-align:center;
padding:35px 15px;
margin-top:40px;
border-top:1px solid var(--border);
color:var(--muted);
font-size:13px;
}

@media(max-width:600px){

.header{
flex-direction:column;
align-items:stretch;
}

.search{
margin-left:0;
}

.grid{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.poster{
height:210px;
font-size:17px;
}

}
</style>
</head>
